<rect x="1000" y="60" width="260" height="676" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1016" y="82" font-size="12" font-weight="700" fill="#334155" text-anchor="start">BẢO MẬT XUYÊN SUỐT</text>
<text x="1016" y="118" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Ít cổng mở</text>
<text x="1016" y="135" font-size="11" font-weight="400" fill="#475569" text-anchor="start">ra ngoài chỉ :8080 (web, API) và</text>
<text x="1016" y="150" font-size="11" font-weight="400" fill="#475569" text-anchor="start">8883 (MQTT); còn lại 127.0.0.1</text>
<text x="1016" y="188" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Danh tính</text>
<text x="1016" y="205" font-size="11" font-weight="400" fill="#475569" text-anchor="start">OIDC/JWT Keycloak; vai</text>
<text x="1016" y="220" font-size="11" font-weight="400" fill="#475569" text-anchor="start">app:cap-phep:*, dx:*</text>
<text x="1016" y="258" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Cách ly dữ liệu</text>
<text x="1016" y="275" font-size="11" font-weight="400" fill="#475569" text-anchor="start">RLS PostgreSQL theo tenant</text>
<text x="1016" y="290" font-size="11" font-weight="400" fill="#475569" text-anchor="start">và theo phân công hồ sơ</text>
<text x="1016" y="328" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Tách quyền (SoD)</text>
<text x="1016" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">người thẩm định không tự duyệt;</text>
<text x="1016" y="360" font-size="11" font-weight="400" fill="#475569" text-anchor="start">truy cập khẩn có hạn, có duyệt</text>
<text x="1016" y="398" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Tệp an toàn</text>
<text x="1016" y="415" font-size="11" font-weight="400" fill="#475569" text-anchor="start">kiểm MIME + ClamAV</text>
<text x="1016" y="430" font-size="11" font-weight="400" fill="#475569" text-anchor="start">trước khi lưu S3</text>
<text x="1016" y="468" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Ký số</text>
<text x="1016" y="485" font-size="11" font-weight="400" fill="#475569" text-anchor="start">PAdES bằng SoftHSM;</text>
<text x="1016" y="500" font-size="11" font-weight="400" fill="#475569" text-anchor="start">mã công khai để tra cứu</text>
<text x="1016" y="538" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Kiểm toán</text>
<text x="1016" y="555" font-size="11" font-weight="400" fill="#475569" text-anchor="start">nhật ký chuỗi băm,</text>
<text x="1016" y="570" font-size="11" font-weight="400" fill="#475569" text-anchor="start">xác minh được, niêm phong</text>
<text x="1016" y="608" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Dữ liệu cá nhân</text>
<text x="1016" y="625" font-size="11" font-weight="400" fill="#475569" text-anchor="start">đồng thuận, DSAR,</text>
<text x="1016" y="640" font-size="11" font-weight="400" fill="#475569" text-anchor="start">che CCCD (Luật 91/2025)</text>
<text x="1016" y="678" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Trình duyệt</text>
<text x="1016" y="695" font-size="11" font-weight="400" fill="#475569" text-anchor="start">CSP chặt, không script ngoài;</text>
<text x="1016" y="710" font-size="11" font-weight="400" fill="#475569" text-anchor="start">trang công khai không script</text>
<text x="20" y="780" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Mũi tên chỉ chiều gọi chính. Chi tiết mạng, cổng và phiên bản: docs/architecture.md. Dữ liệu demo là dữ liệu tổng hợp.</text>
