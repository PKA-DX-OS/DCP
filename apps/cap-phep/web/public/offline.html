<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ngoại tuyến — DX-OS Cấp phép</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0b1322;
        color: #f0f4fa;
        padding: 24px;
      }
      main {
        max-width: 520px;
        padding: 28px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 16px 40px rgba(3, 7, 18, 0.5);
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 8px 0; color: #7c9cc4; line-height: 1.55; }
      a {
        display: inline-flex;
        margin-top: 16px;
        padding: 10px 16px;
        border-radius: 14px;
        background: #e4b863;
        color: #060a13;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Đang ngoại tuyến</h1>
      <p>Ứng dụng chưa tải được trang này khi không có mạng. Phiếu hiện trường đã lưu trên thiết bị vẫn còn.</p>
      <p>Kết nối mạng rồi mở lại ứng dụng để đồng bộ phiếu.</p>
      <a href="/?tab=hien-truong">Thử lại</a>
    </main>
  </body>
</html>
