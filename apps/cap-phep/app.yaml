code: cap-phep
name: Cấp phép xây dựng nhà ở riêng lẻ và hậu kiểm công trường
version: 1.1.0
schema: app_cap_phep
# Các phường (tenant) dùng ứng dụng; app_manager deploy BPMN, nạp tri thức và seed theo danh sách này
tenants: [phuong-a, phuong-b]
migrations: db/migrations

roles:
  - code: chu-dau-tu
    name: Chủ đầu tư nộp hồ sơ
    description: Công dân hoặc tổ chức nộp hồ sơ xin cấp phép
  - code: mot-cua
    name: Cán bộ Tiếp nhận Một cửa
    description: Tiếp nhận, kiểm tra hồ sơ ban đầu
  - code: tham-dinh
    name: Thẩm định viên
    description: Thẩm định nội dung kỹ thuật hồ sơ
  - code: lanh-dao
    name: Lãnh đạo phê duyệt
    description: Phân công thẩm định và duyệt cấp giấy phép
  - code: trat-tu-xd
    name: Cán bộ Trật tự xây dựng
    description: Hậu kiểm công trường và xử lý cảnh báo cảm biến

bpmn:
  - bpmn/cap-phep.bpmn20.xml
  - bpmn/hau-kiem.bpmn20.xml
  - bpmn/quy-hoach.bpmn20.xml
  - bpmn/nghiem-thu.bpmn20.xml
  - bpmn/tham-dinh-thiet-ke.bpmn20.xml

doc_templates:
  - doc_type: giay-phep-xay-dung
    template_file: templates/giay-phep.html
    title: Giấy phép xây dựng nhà ở riêng lẻ
  - doc_type: giay_phep
    template_file: templates/giay-phep.html
    title: Giấy phép xây dựng nhà ở riêng lẻ

object_access:
  ho_so: app_cap_phep_private.can_access_ho_so
  draft.ho_so: app_cap_phep_private.can_access_ho_so

dsar_policies:
  approver_roles: ["app:cap-phep:lanh-dao", "dx:tenant-admin", "dx:platform-admin"]

break_glass:
  object_types: ["ho_so"]
  requester_roles: ["app:cap-phep:tham-dinh", "app:cap-phep:mot-cua", "app:cap-phep:trat-tu-xd", "dx:auditor"]
  approver_roles: ["app:cap-phep:lanh-dao", "dx:approver", "dx:tenant-admin", "dx:platform-admin"]

flow_policies:
  # Mô phỏng cảm biến (chỉ DEMO_MODE): vai được phép và hàm kiểm vị trí thuộc địa bàn (U-04)
  demo_sensor:
    roles:
      - "app:cap-phep:trat-tu-xd"
    site_check: app_cap_phep_private.vi_tri_thuoc_dia_ban
  # Biến quy trình được trả kèm danh sách nhiệm vụ cho giao diện (U-07)
  task_list_variables: [ho_so_id, ma_ho_so, business_key, phieu_id, object_id, object_type, dia_chi_cong_trinh, trang_thai_ho_so, do_uu_tien, site_id, chi_so, gia_tri, nguong]
  submitter_roles:
    - "app:cap-phep:chu-dau-tu"
  manager_roles:
    - "app:cap-phep:lanh-dao"
    - "app:cap-phep:mot-cua"
  staff_roles:
    - "app:cap-phep:mot-cua"
    - "app:cap-phep:tham-dinh"
    - "app:cap-phep:lanh-dao"
    - "app:cap-phep:trat-tu-xd"
  submitter_var_names:
    - "chu_dau_tu_sub"
    - "chuDauTuSub"
    - "submitter_sub"
    - "cdt_sub"
  owner_var_names:
    - "chu_dau_tu_sub"
    - "chuDauTuSub"
    - "submitter_sub"
    - "initiator"
    - "owner_sub"
    - "object_owner_sub"
    - "cdt_sub"
  task_variables:
    taskKiemTraQuyHoach: [quy_hoach_pass, quy_hoach_fail_rules, ket_qua_kiem_tra_id]
    taskXuLyQuyHoach: [quy_hoach_pass]
    taskPhanCongThamDinh: [nguoiThamDinh]
    taskNghiemThuMong: [mong_dat, ket_qua_nghiem_thu, ghi_chu]
    taskKhacPhucMong: [noi_dung_khac_phuc, ket_qua_nghiem_thu]
    taskNghiemThuKetCau: [ket_qua_nghiem_thu, ghi_chu]
    taskNghiemThuHoanThien: [ket_qua_nghiem_thu, ghi_chu]
    taskHoanCong: [so_bien_ban, ket_qua_nghiem_thu]
    taskThamDinhBoMon: [ket_qua_bo_mon, nhan_xet_bo_mon]
    taskTongHopThietKe: [ket_luan_thiet_ke, ghi_chu_thiet_ke]
    taskBoSungThietKe: [mo_ta_bo_sung]
    taskKiemTraHopLe: [hoSoHopLe, lyDoTra, lyDoBoSung]
    taskPhanCong: [nguoiThamDinh, lanhDaoPhanCong]
    taskThamDinh: [ketQuaThamDinh, noiDungThamDinh]
    taskThamDinhNhanh: [ketQuaThamDinh, noiDungThamDinh]
    taskThamDinhChuyenSau: [ketQuaThamDinh, noiDungThamDinh]
    taskThamDinhDonGian: [ketQuaThamDinh, noiDungThamDinh]
    taskDuyetCapPhep: [pheDuyet, dongYCapPhep, yKienPheDuyet]
    taskPheDuyet: [pheDuyet, dongYCapPhep, yKienPheDuyet]
    taskPheDuyetTruyCapKhan: [quyetDinh, lyDoTuChoi, p_ho_so_id, ho_so_id]
    taskChoBoSung: [noiDungBoSung, taiLieuBoSung]
    taskKiemTraHienTruong: [ketLuan, ghiChu]
    taskXuLyViPham: [ghiChu]
  submitter_tasks: ["taskChoBoSung", "taskBoSungThietKe"]
  variable_roles:
    ketLuan: ["app:cap-phep:trat-tu-xd"]
    quy_hoach_pass: ["app:cap-phep:tham-dinh", "app:cap-phep:mot-cua", "app:cap-phep:lanh-dao"]
    quy_hoach_fail_rules: ["app:cap-phep:tham-dinh", "app:cap-phep:mot-cua"]
    ket_qua_kiem_tra_id: ["app:cap-phep:tham-dinh", "app:cap-phep:mot-cua"]
    mong_dat: ["app:cap-phep:tham-dinh", "app:cap-phep:trat-tu-xd"]
    ket_qua_nghiem_thu: ["app:cap-phep:tham-dinh", "app:cap-phep:trat-tu-xd", "app:cap-phep:mot-cua", "app:cap-phep:lanh-dao"]
    ghi_chu: ["app:cap-phep:tham-dinh", "app:cap-phep:trat-tu-xd", "app:cap-phep:mot-cua"]
    noi_dung_khac_phuc: ["app:cap-phep:chu-dau-tu", "app:cap-phep:trat-tu-xd"]
    so_bien_ban: ["app:cap-phep:mot-cua", "app:cap-phep:lanh-dao"]
    ket_qua_bo_mon: ["app:cap-phep:tham-dinh"]
    nhan_xet_bo_mon: ["app:cap-phep:tham-dinh"]
    ket_luan_thiet_ke: ["app:cap-phep:lanh-dao"]
    ghi_chu_thiet_ke: ["app:cap-phep:lanh-dao"]
    mo_ta_bo_sung: ["app:cap-phep:chu-dau-tu"]
    noiDungBoSung: ["app:cap-phep:chu-dau-tu"]
    taiLieuBoSung: ["app:cap-phep:chu-dau-tu"]
    nguoiThamDinh: ["app:cap-phep:lanh-dao"]
    lanhDaoPhanCong: ["app:cap-phep:lanh-dao"]
    ketQuaThamDinh: ["app:cap-phep:tham-dinh"]
    noiDungThamDinh: ["app:cap-phep:tham-dinh"]
    dongYCapPhep: ["app:cap-phep:lanh-dao"]
    yKienPheDuyet: ["app:cap-phep:lanh-dao"]
    pheDuyet: ["app:cap-phep:lanh-dao"]
    hoSoHopLe: ["app:cap-phep:mot-cua"]
    lyDoTra: ["app:cap-phep:mot-cua"]
    lyDoBoSung: ["app:cap-phep:mot-cua"]
  sod_rules:
    taskDuyetCapPhep:
      exclude_variable: nguoiThamDinh
    taskPheDuyet:
      exclude_variable: nguoiThamDinh
  initial_task: taskKiemTraHopLe
  initial_tasks:
    cap-phep: taskKiemTraHopLe
    quy-hoach: taskKiemTraQuyHoach
    nghiem-thu: taskNghiemThuMong
    tham-dinh-thiet-ke: taskThamDinhBoMon
  task_transitions:
    taskKiemTraHopLe: taskPhanCong
    taskChoBoSung: taskKiemTraHopLe
    taskPhanCong: taskThamDinh
    taskThamDinh: taskDuyetCapPhep
    taskThamDinhNhanh: taskDuyetCapPhep
    taskKiemTraQuyHoach: taskPhanCongThamDinh
    taskXuLyQuyHoach: taskKiemTraQuyHoach
    taskPhanCongThamDinh: taskThamDinh
    taskNghiemThuMong: taskNghiemThuKetCau
    taskKhacPhucMong: taskNghiemThuMong
    taskNghiemThuKetCau: taskNghiemThuHoanThien
    taskNghiemThuHoanThien: taskHoanCong
    taskThamDinhBoMon: taskTongHopThietKe
    taskTongHopThietKe: taskBoSungThietKe
    taskBoSungThietKe: taskThamDinhBoMon
  # Luồng cấp phép cộng lại đúng 7 ngày (Điều 54 NĐ 217/2026): kiểm tra 1, phân công 1, thẩm định 3,
  # phê duyệt và cấp 2. Thẩm định nhanh (không thuộc khu quản lý kiến trúc) 2 ngày.
  sla:
    taskKiemTraHopLe: P1D
    taskPhanCong: P1D
    taskThamDinh: P3D
    taskThamDinhNhanh: P2D
    taskDuyetCapPhep: P2D
    taskKiemTraQuyHoach: P2D
    taskXuLyQuyHoach: P7D
    taskPhanCongThamDinh: P1D
    taskNghiemThuMong: P3D
    taskKhacPhucMong: P7D
    taskNghiemThuKetCau: P3D
    taskNghiemThuHoanThien: P3D
    taskHoanCong: P3D
    taskThamDinhBoMon: P5D
    taskTongHopThietKe: P2D
    taskBoSungThietKe: P7D
    # Hậu kiểm: kiểm tra hiện trường 2 ngày từ lúc lập phiếu (khớp han_xu_ly_at của phiếu,
    # migration 22), khắc phục vi phạm 7 ngày như khắc phục nghiệm thu.
    taskKiemTraHienTruong: P2D
    taskXuLyViPham: P7D
  default_process_variables:
    tham-dinh-thiet-ke:
      bo_mon_can_tham_dinh: ["kien_truc", "ket_cau", "mep", "pccc"]
  on_timer: app_cap_phep_private.ghi_qua_han
  sync_state_sql: app_cap_phep_private.sync_flow_state
  sync_state_sql_by_process:
    cap-phep: app_cap_phep_private.sync_flow_state
    quy-hoach: app_cap_phep_private.sync_quy_hoach_state
    nghiem-thu: app_cap_phep_private.sync_nghiem_thu_state
    hau-kiem: app_cap_phep_private.sync_hau_kiem_state
  on_task_complete:
    taskDuyetCapPhep:
      when: { dongYCapPhep: true }
      guard_sql: app_cap_phep_private.kiem_tra_hook_ky
      sign:
        doc_type: giay-phep-xay-dung
        data_sql: app_cap_phep_private.du_lieu_giay_phep
        object_type: ho_so
        object_id_field: ho_so_id
      after_sql: app_cap_phep_private.cap_giay_phep
    taskPheDuyet:
      when: { pheDuyet: true }
      guard_sql: app_cap_phep_private.kiem_tra_hook_ky
      sign:
        doc_type: giay-phep-xay-dung
        data_sql: app_cap_phep_private.du_lieu_giay_phep
        object_type: ho_so
        object_id_field: ho_so_id
      after_sql: app_cap_phep_private.cap_giay_phep

doc_signers:
  giay-phep-xay-dung:
    sign_roles: ["app:cap-phep:lanh-dao"]
    revoke_roles: ["app:cap-phep:lanh-dao"]
  giay_phep:
    sign_roles: ["app:cap-phep:lanh-dao"]
    revoke_roles: ["app:cap-phep:lanh-dao"]

alert_hooks:
  hau-kiem:
    on_alert: "app_cap_phep_private.tao_phieu_kiem_tra"
    on_process_started: "app_cap_phep_private.gan_quy_trinh_phieu"

ingest_rules:
  rules_file: rules/nguong.yaml

knowledge:
  dir: knowledge/

# Manifest giấy tờ bắt buộc theo thủ tục (P1 - Poka-yoke)
# UI sinh checklist động từ đây; RPC nop_ho_so kiểm tra lại ở server (fail-closed).
document_manifest:
  thu_tuc: cap-phep-nha-o-rieng-le
  ten: Cấp phép xây dựng nhà ở riêng lẻ theo Điều 60 NĐ 217/2026/NĐ-CP
  doi_tuong:
    - code: ho_gia_dinh_ca_nhan
      ten: Nhà ở riêng lẻ của hộ gia đình, cá nhân
    - code: to_chuc
      ten: Nhà ở riêng lẻ của tổ chức
  requirements:
    - loai: don
      ten: Đơn đề nghị cấp giấy phép xây dựng (Mẫu số 01 Phụ lục II)
      bat_buoc: true
      yeu_cau_hieu_luc: false
      thong_tin: [ho_ten, cccd]
      legal_citation_key: ND217-D60-K3
      mau_bieu: Mẫu số 01 Phụ lục II NĐ 217/2026/NĐ-CP
    - loai: giay_to_dat
      ten: Một trong các giấy tờ hợp pháp về đất đai theo Điều 55
      bat_buoc: true
      yeu_cau_hieu_luc: true
      thong_tin: [so_thua, dien_tich]
      legal_citation_key: ND217-D55
    - loai: ban_ve_mat_bang
      ten: Bản vẽ mặt bằng công trình trên lô đất kèm sơ đồ vị trí
      bat_buoc: true
      yeu_cau_hieu_luc: false
      thong_tin: []
      legal_citation_key: ND217-D60-K3
    - loai: ban_ve_tang
      ten: Bản vẽ mặt bằng các tầng, mặt đứng và mặt cắt chính
      bat_buoc: true
      yeu_cau_hieu_luc: false
      thong_tin: [so_tang]
      legal_citation_key: ND217-D60-K3
    - loai: ban_ve_mong
      ten: Bản vẽ mặt bằng móng, mặt cắt móng kèm sơ đồ đấu nối hạ tầng
      bat_buoc: true
      yeu_cau_hieu_luc: false
      thong_tin: []
      legal_citation_key: ND217-D60-K3
    - loai: cam_ket_an_toan
      ten: Bản cam kết bảo đảm an toàn đối với công trình liền kề (Điều 60 khoản 3)
      bat_buoc: true
      yeu_cau_hieu_luc: false
      thong_tin: []
      legal_citation_key: ND217-D60-K3
    - loai: pccc
      ten: Kết quả thực hiện TTHC PCCC&CNCH (chỉ khi có yêu cầu)
      bat_buoc: false
      yeu_cau_hieu_luc: true
      thong_tin: []
      legal_citation_key: ND217-D60-K3
    - loai: nha_thau
      ten: Chứng chỉ năng lực nhà thầu (không bắt buộc cho mọi hồ sơ)
      bat_buoc: false
      yeu_cau_hieu_luc: true
      thong_tin: []
      legal_citation_key: ND212-TOANVAN
    - loai: le_phi
      ten: Biên lai lệ phí (không mặc định là thành phần đầu vào)
      bat_buoc: false
      yeu_cau_hieu_luc: false
      thong_tin: []
      legal_citation_key: LP97-TOANVAN
    - loai: tham_tra
      ten: Báo cáo kết quả thẩm tra thiết kế (nếu có yêu cầu)
      bat_buoc: false
      yeu_cau_hieu_luc: false
      thong_tin: []
      legal_citation_key: ND217-D60-K3
    - loai: tai_lieu_bo_sung
      ten: Tài liệu bổ sung theo yêu cầu
      bat_buoc: false
      yeu_cau_hieu_luc: false
      thong_tin: []

metrics:
  - code: ho_so_moi
    name: Hồ sơ mới trong kỳ
    unit: hồ sơ
    query_type: lakehouse
    sql: "SELECT count(*) FROM app_cap_phep.ho_so WHERE tenant = $1 AND ($2::timestamptz IS NULL OR created_at >= $2) AND ($3::timestamptz IS NULL OR created_at < $3)"
    lineage_job: export_warm_lakehouse
    bang_nguon: [app_cap_phep.ho_so]
    dieu_kien_loc: "tenant = <tenant từ token>; created_at trong tháng nếu có tham số thang"
  - code: ho_so_dang_xu_ly
    name: Hồ sơ đang xử lý
    unit: hồ sơ
    query_type: transactional
    sql: "SELECT count(*) FROM app_cap_phep.ho_so WHERE tenant = $1 AND trang_thai NOT IN ('DA_CAP', 'TU_CHOI')"
    bang_nguon: [app_cap_phep.ho_so]
    dieu_kien_loc: "tenant = <tenant>; trạng thái không phải DA_CAP hoặc TU_CHOI"
  - code: ho_so_qua_han
    name: Hồ sơ quá hạn
    unit: hồ sơ
    query_type: transactional
    sql: "SELECT count(*) FROM app_cap_phep.ho_so WHERE tenant = $1 AND (han_tong_at < now() OR qua_han = true) AND trang_thai NOT IN ('DA_CAP', 'TU_CHOI')"
    bang_nguon: [app_cap_phep.ho_so]
    dieu_kien_loc: "tenant = <tenant>; quá hạn tổng hoặc qua_han = true; chưa đóng"
  - code: thoi_gian_xu_ly_tb
    name: Thời gian xử lý trung bình (ngày làm việc)
    unit: ngày
    query_type: hybrid
    sql: "SELECT round(avg(app_cap_phep.so_ngay_lam_viec(h.created_at, g.ngay_cap))::numeric, 1) FROM app_cap_phep.ho_so h JOIN app_cap_phep.giay_phep g ON g.ho_so_id = h.id WHERE h.tenant = $1 AND ($2::timestamptz IS NULL OR g.ngay_cap >= $2) AND ($3::timestamptz IS NULL OR g.ngay_cap < $3)"
    bang_nguon: [app_cap_phep.ho_so, app_cap_phep.giay_phep]
    dieu_kien_loc: "tenant = <tenant>; hồ sơ đã có giấy phép; trung bình số ngày làm việc từ nộp (created_at) đến ngày cấp (ngay_cap); ngay_cap trong tháng nếu có tham số thang; null khi chưa có giấy phép"
  - code: truy_cap_tu_choi
    name: Lượt truy cập bị từ chối (403)
    unit: lượt
    query_type: audit
    sql: "SELECT count(*) FROM core.audit_log WHERE tenant = $1 AND action = 'access.denied'"
    lineage_job: audit_verification
    bang_nguon: [core.audit_log]
    dieu_kien_loc: "tenant = <tenant>; action = 'access.denied'"
  - code: phieu_kiem_tra
    name: Số phiếu kiểm tra hiện trường
    unit: phiếu
    query_type: transactional
    sql: "SELECT count(*) FROM app_cap_phep.phieu_kiem_tra WHERE tenant = $1"
    bang_nguon: [app_cap_phep.phieu_kiem_tra]
    dieu_kien_loc: "tenant = <tenant>"
  - code: canh_bao_cong_truong
    name: Cảnh báo vượt ngưỡng công trường
    unit: lượt
    query_type: transactional
    sql: "SELECT count(*) FROM core.outbox WHERE tenant = $1 AND topic = 'alert.threshold'"
    lineage_job: iot_ingest
    bang_nguon: [core.outbox]
    dieu_kien_loc: "tenant = <tenant>; topic = 'alert.threshold'"
  - code: ho_so_fail_quy_hoach
    name: Hồ sơ không đạt kiểm tra quy hoạch
    unit: hồ sơ
    query_type: transactional
    sql: "SELECT count(DISTINCT ho_so_id) FROM app_construction.ket_qua_kiem_tra_quy_hoach WHERE tenant = $1 AND pass = false AND ho_so_id IS NOT NULL"
    bang_nguon: [app_construction.ket_qua_kiem_tra_quy_hoach]
    dieu_kien_loc: "tenant = <tenant>; pass = false"
  - code: ho_so_dang_nghiem_thu
    name: Hồ sơ đang có mốc nghiệm thu
    unit: hồ sơ
    query_type: transactional
    sql: "SELECT count(DISTINCT ho_so_id) FROM app_construction.moc_nghiem_thu WHERE tenant = $1"
    bang_nguon: [app_construction.moc_nghiem_thu]
    dieu_kien_loc: "tenant = <tenant>"
  - code: ty_le_dung_han
    name: Tỷ lệ hồ sơ đã cấp đúng hạn
    unit: phần trăm
    query_type: transactional
    sql: "SELECT round(100.0 * count(*) FILTER (WHERE g.ngay_cap <= h.han_tong_at) / NULLIF(count(*), 0), 1) FROM app_cap_phep.ho_so h JOIN app_cap_phep.giay_phep g ON g.ho_so_id = h.id WHERE h.tenant = $1 AND ($2::timestamptz IS NULL OR g.ngay_cap >= $2) AND ($3::timestamptz IS NULL OR g.ngay_cap < $3)"
    bang_nguon: [app_cap_phep.ho_so, app_cap_phep.giay_phep]
    dieu_kien_loc: "tenant = <tenant>; hồ sơ đã có giấy phép; ngay_cap <= han_tong_at; ngay_cap trong tháng nếu có tham số thang; null khi chưa có giấy phép"
  - code: vi_pham
    name: Số vụ vi phạm đã kết luận
    unit: vụ
    query_type: transactional
