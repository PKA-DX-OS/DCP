# Phục vụ bản build Vite. index.html không được cache: sau mỗi lần phát hành trình duyệt lấy ngay
# danh sách tệp mới, không giữ index.html cũ trỏ tới tệp JS/CSS đã bị xóa (trang trắng).
# Tệp trong assets/ có mã băm trong tên nên cache lâu được.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        index index.html;
    }
}
