version = 1

[[annotations]]
path = ["REUSE.toml", "LICENSE", "LICENSES/**", ".gitignore", ".gitattributes", ".dockerignore", "**/.dockerignore", "pyproject.toml", "pytest.ini", "*.toml", "*.ini"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DCP contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["*.json", "**/*.json", "*.env*", "**/*.env*", "*.pub", "**/*.pub", "**/*.crt", "**/*.key", "**/*.pem", "**/*.pyc", "**/__pycache__/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DCP contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["docs/**", "*.md", "**/*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DCP contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["**/*.txt", "**/*.csv"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DCP contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["apps/**/dist/**", "**/dist/**", "**/*.svg", "**/*.ico", "**/*.png", "**/*.woff*", "**/*.ttf", "**/*.html", "**/*.css"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DCP contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Thư mục sinh tự động khi chạy demo/kiểm thử, không phải mã nguồn
[[annotations]]
path = ["secrets/**", ".pytest_cache/**", ".ruff_cache/**", "**/node_modules/**", "backups/**", "logs/**", "dist/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 DCP contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["apps/cap-phep/web/src/utils/labels.ts"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DCP contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["tests/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DCP contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
