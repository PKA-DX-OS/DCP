name: DX-OS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compliance-and-security:
    name: Kiểm tra Bản quyền & An toàn Mã nguồn
    runs-on: ubuntu-24.04
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4.2.2

      - name: Cài đặt Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Cài đặt công cụ kiểm tra bản quyền & linter
        run: |
          python -m pip install --upgrade pip
          pip install reuse ruff pytest pytest-asyncio asyncpg httpx pyjwt cryptography pyyaml pydantic

      - name: Kiểm tra tuân thủ REUSE (reuse lint)
        run: reuse lint

      - name: Kiểm tra giấy phép thư viện phụ thuộc (make license-check)
        run: make license-check

      - name: Quét rò rỉ bí mật trong Git (Gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Quét lỗ hổng và kiểm tra giấy phép hệ thống tệp (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

      - name: Chạy linter mã nguồn Python (Ruff)
        run: make lint

      - name: Chạy kiểm thử đơn vị Python (Unit Tests)
        run: make test

      - name: Quét tuân thủ quy chuẩn pháp lý (vn-law-check)
        run: |
          chmod +x scripts/scan.sh || true
          ./scripts/scan.sh apps/cap-phep/web || true
        continue-on-error: true

  build-and-smoke:
    name: Đóng gói Container & Kiểm thử Smoke
    runs-on: ubuntu-24.04
    needs: compliance-and-security
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4.2.2

      - name: Cài đặt Docker Compose v2
        run: docker compose version

      - name: Khởi tạo biến môi trường mẫu
        run: make init

      - name: Chạy kiểm thử Smoke Test toàn diện
        run: make smoke

      - name: Quét lộ lọt dữ liệu & phân quyền tự động (Q-03)
        run: docker compose run --rm tools python scripts/scan_exposure.py
