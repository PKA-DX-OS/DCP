name: Track A integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  integration:
    name: Dựng stack và chạy integration Track A
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4.2.2

      - name: Cài Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Cài phụ thuộc test
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pymupdf

      - name: Khởi tạo môi trường demo
        run: bash ./dx.sh init --demo

      - name: Dựng stack
        run: bash ./dx.sh up

      - name: Chạy kiểm thử Track A
        env:
          PYTHONPATH: services:.
        run: |
          python -m pytest tests/unit -q
          python -m pytest tests/integration/test_A01_legal_api.py tests/integration/test_A02_planning_api.py \
            tests/integration/test_A03_acceptance_api.py tests/integration/test_A04_legal_alignment.py \
            tests/integration/test_A05_data_export_audit.py tests/integration/test_A06_flow_lifecycle.py \
            tests/integration/test_A07_legal_compliance.py tests/integration/test_A08_performance.py -q

      - name: Dọn stack
        if: always()
        run: bash ./dx.sh down
