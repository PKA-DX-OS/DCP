authorization {
    users = [
        {
            user: "${NATS_INGEST_USER}"
            password: "${NATS_INGEST_PASSWORD}"
            permissions = {
                publish = {
                    allow = [">"]
                }
                subscribe = {
                    allow = [">"]
                }
            }
        },
        {
            user: "${NATS_MQTT_USER}"
            password: "${NATS_MQTT_PASSWORD}"
            permissions = {
                publish = {
                    allow = ["dxos.phuong-a.site.CT-01.>"]
                }
                subscribe = {
                    allow = ["dxos.phuong-a.commands.CT-01"]
                }
            }
        },
        {
            user: "${NATS_SENSOR_B_USER}"
            password: "${NATS_SENSOR_B_PASSWORD}"
            permissions = {
                publish = {
                    allow = ["dxos.phuong-b.site.CT-02.>"]
                }
                subscribe = {
                    allow = ["dxos.phuong-b.commands.CT-02"]
                }
            }
        }
    ]
}
