port: 4222
server_name: dxos-nats

# Bật lưu trữ sự kiện bền vững JetStream
jetstream {
    store_dir: "/data/jetstream"
    max_memory_store: 256MB
    max_file_store: 2GB
}

# Cổng MQTT qua TLS phục vụ cảm biến IoT
mqtt {
    port: 8883
    tls {
        cert_file: "/certs/server.crt"
        key_file: "/certs/server.key"
    }
}

# Nạp cấu hình xác thực và phân quyền người dùng
include "auth.conf"
