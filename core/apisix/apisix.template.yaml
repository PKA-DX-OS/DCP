# Header bảo mật toàn cục (F-36, V4-04)
global_rules:
  - id: 1
    plugins:
      response-rewrite:
        headers:
          X-Frame-Options: DENY
          X-Content-Type-Options: nosniff
          Referrer-Policy: same-origin

