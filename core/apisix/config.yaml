nginx_config:
  http:
    access_log_format: '$remote_addr - $remote_user [$time_local] $http_host "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_referer" "$http_user_agent" $upstream_addr $upstream_status $upstream_response_time "$upstream_scheme://$upstream_host$uri"'

apisix:
  node_listen: 8080
  enable_control: true
  dns_resolver_valid: 1
  control:
    ip: "127.0.0.1"
    port: 9092
  enable_admin: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    enable_export_server: false

plugins:
  - openid-connect
  - limit-count
  - proxy-rewrite
  - response-rewrite
  - prometheus
  - request-id
  - cors
