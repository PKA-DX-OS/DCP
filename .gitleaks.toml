# Cấu hình gitleaks: dùng bộ luật mặc định, chỉ bỏ qua các chuỗi đã xác minh không phải bí mật.
title = "DX-OS gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Đường dẫn API nội bộ trong dx.sh/dx.ps1 bị luật generic-api-key nhận nhầm"
regexTarget = "secret"
regexes = ['''^8080/api/v1/ingest$''']
